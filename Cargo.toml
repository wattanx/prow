[package]
name = "prow"
version = "0.3.1"
edition = "2024"
description = "GitHub PR management TUI"
license = "MIT"
authors = ["wattanx"]

[[bin]]
name = "prow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
directories = "6"
open = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
insta = { version = "1", features = ["filters"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
